[project]
name = "isocity"
version = "0.1.0"
description = "Isometric pixel-art map of a real city — pipeline"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1",
    "numpy>=2",
    "osmium>=4.3.2",
    "pillow>=11",
    "pyvips[binary]>=3",
    "pyyaml>=6",
    "scipy>=1.13",
    "shapely>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
